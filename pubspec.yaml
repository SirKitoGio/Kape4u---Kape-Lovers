publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.6
  http: ^1.6.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  url_launcher: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  device_preview: ^1.3.1
  flutter_map: ^8.2.2
